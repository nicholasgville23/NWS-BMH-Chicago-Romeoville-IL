<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KLOT LOTIEM TEXT WORKSTATION (Web Preview)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 12px }
    .header { display:flex; justify-content:space-between; align-items:center }
    .box { border:1px solid #ccc; padding:8px; margin-top:8px }
  </style>
</head>
<body>
  <div class="header">
    <h2>KLOT LOTIEM TEXT WORKSTATION - Web Preview</h2>
    <div id="ip">IP: --</div>
  </div>
  <div class="box">
    <label>New Text Message:</label>
    <textarea id="msg" rows="6" style="width:100%">This is a test.</textarea>
    <div style="margin-top:8px">
      <label><input type="checkbox" id="send_bmh" checked/> Send to BMH</label>
      <label style="margin-left:8px"><input type="checkbox" id="send_email"/> Send to Email</label>
    </div>
    <button id="send">Send (stub)</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
